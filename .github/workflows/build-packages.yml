name: Build Packages

on:
  push:
    branches:
      - main
      - master
      - codex/xpongecpp-v1
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CIBW_BUILD: "cp310-* cp311-* cp312-*"
  CIBW_SKIP: "*-musllinux_*"
  CIBW_TEST_COMMAND: >-
    python -c "import importlib.util, XpongeCPP, Xponge,
    XpongeCPP.io_bundle, XpongeCPP.metal_assignment;
    assert XpongeCPP.__version__ == '0.2.6';
    assert not hasattr(XpongeCPP, 'MC' + 'PB');
    assert importlib.util.find_spec('XpongeCPP.' + ('MC' + 'PB').lower()) is None"
  CIBW_BEFORE_ALL_LINUX: >-
    if command -v dnf >/dev/null 2>&1; then dnf install -y hdf5-devel;
    elif command -v yum >/dev/null 2>&1; then yum install -y hdf5-devel;
    else apt-get update && apt-get install -y libhdf5-dev; fi
  CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
  CIBW_BEFORE_BUILD_WINDOWS: "python -m pip install delvewheel"
  CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: "delvewheel repair -w {dest_dir} {wheel}"

jobs:
  sponge-numerical:
    name: SPONGE CPU numerical parity
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout XpongeCPP
        uses: actions/checkout@v4

      - name: Checkout pinned SPONGE CPU runtime
        uses: actions/checkout@v4
        with:
          repository: SPONGEMM/SPONGE
          ref: 4c694ebab7032b0ef28d8312115d0f3253800125
          path: .ci/SPONGE

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          run-install: false

      - name: Install and build XpongeCPP
        run: |
          pixi install
          pixi run install-dev

      - name: Build pinned SPONGE CPU runtime
        run: |
          pixi install --manifest-path .ci/SPONGE/pixi.toml -e dev-cpu
          pixi run --manifest-path .ci/SPONGE/pixi.toml -e dev-cpu configure
          pixi run --manifest-path .ci/SPONGE/pixi.toml -e dev-cpu compile

      - name: Run mandatory bundle and 1.7b8 numerical gates
        shell: bash
        env:
          SPONGE_EXECUTABLE: ${{ github.workspace }}/.ci/SPONGE/build-dev-cpu/SPONGE
        run: |
          test -x "$SPONGE_EXECUTABLE"
          pixi run python -m pytest -q \
            tests/test_bundle_converter.py \
            tests/test_origin_17b8_numerical_e2e.py

  source-tests:
    name: Source tests (registry isolation)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native and Python test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run force-field isolation cohort in forward order
        run: >-
          python -m pytest -q
          tests/test_forcefield_registry_isolation.py
          tests/test_forcefield_families.py
          tests/test_full_amber_data.py
          tests/test_glycam_parity.py
          tests/origin_test_metal_assignment_contracts.py
          tests/origin_test_metal_assignment_base.py
          tests/origin_test_metal_assignment_apply.py
          tests/test_bundle_native.py
          tests/test_bundle_protocol.py
          tests/test_bundle_converter.py

      - name: Run force-field isolation cohort in reverse order
        run: >-
          python -m pytest -q
          tests/origin_test_metal_assignment_apply.py
          tests/origin_test_metal_assignment_base.py
          tests/origin_test_metal_assignment_contracts.py
          tests/test_glycam_parity.py
          tests/test_full_amber_data.py
          tests/test_forcefield_families.py
          tests/test_forcefield_registry_isolation.py
          tests/test_bundle_converter.py
          tests/test_bundle_protocol.py
          tests/test_bundle_native.py

      - name: Run Xponge-origin compatibility parity cohorts
        run: >-
          python -m pytest -q
          tests/test_release_023.py
          tests/test_origin_resp_linear_constraints.py
          tests/test_origin_io_bundle.py
          tests/test_origin_io_bundle_reverse.py
          tests/test_origin_bundle_mdanalysis.py
          tests/origin_test_metal_assignment_contracts.py
          tests/origin_test_metal_assignment_artifacts.py
          tests/origin_test_metal_assignment_base.py
          tests/origin_test_metal_assignment_base_charge.py
          tests/origin_test_metal_assignment_resp.py
          tests/origin_test_metal_assignment_hessian.py
          tests/origin_test_metal_assignment_apply.py

  build-wheel-linux:
    name: Build Linux wheel (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-24.04
            arch: x86_64
            full-deps: true
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
            full-deps: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip twine

      - name: Build Linux wheel with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        with:
          output-dir: dist

      - name: Check wheel metadata
        run: python -m twine check dist/*

      - name: Full dependency install test (Linux x64 only)
        if: ${{ matrix.full-deps }}
        shell: bash
        run: |
          python -m venv .wheel-full
          .wheel-full/bin/python -m pip install --upgrade pip
          .wheel-full/bin/python -m pip install dist/*cp311*.whl
          .wheel-full/bin/python -c "import XpongeCPP, Xponge; import Xponge.forcefield.amber.ff19sb; from Xponge.forcefield.special import gb; print(XpongeCPP.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl

  build-wheel-native:
    name: Build native wheel (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-intel
            runner: macos-15-intel
            arch: x86_64
          - label: macos-arm64
            runner: macos-15
            arch: arm64
          - label: windows-x64
            runner: windows-2025
            arch: AMD64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install macOS native dependencies
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          brew install hdf5
          echo "CMAKE_PREFIX_PATH=$(brew --prefix hdf5)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "hdf5[core,zlib]:x64-windows"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT -replace '\\', '/'
          "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install wheel tools
        run: python -m pip install --upgrade pip twine

      - name: Build native wheel with cibuildwheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: dist

      - name: Check wheel metadata
        run: python -m twine check dist/*

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist (linux-x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip and build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Check sdist metadata
        run: python -m twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
